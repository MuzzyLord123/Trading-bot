[theme]
# Modern dark theme with accent green for gains. Streamlit picks these
# up automatically when running `streamlit run dashboard.py`.
base = "dark"
primaryColor = "#00C896"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
