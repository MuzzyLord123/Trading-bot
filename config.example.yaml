# ============================================================================
# Advanced Trading Bot - Configuration
# Copy to config.yaml and tune to taste. config.yaml is gitignored.
# ============================================================================

exchange:
  # Any exchange supported by ccxt works (binance, kraken, coinbase, bybit, kucoin...).
  # Kraken is a good UK-friendly choice with GBP pairs.
  name: kraken
  # Some exchanges (coinbase, okx, kucoin) require a passphrase.
  requires_password: false
  # Sandbox / testnet if the exchange exposes one (binance does; kraken does not).
  sandbox: false
  # Rate limiter – let ccxt space out requests automatically.
  enable_rate_limit: true

trading:
  # 'paper' simulates fills against real prices, 'live' sends real orders.
  # Always start on paper. Switch to live only once you trust the behaviour.
  mode: paper

  # The quote currency your capital is denominated in.
  quote_currency: GBP

  # Starting capital used by paper trading and backtests (real capital in live).
  starting_capital: 500.0

  # Markets the bot will scan. Must exist on the chosen exchange.
  symbols:
    - BTC/GBP
    - ETH/GBP
    - SOL/GBP

  # Candle timeframe the bot operates on.
  timeframe: 1h

  # Seconds between each live cycle (ignored in backtest).
  poll_interval_seconds: 60

  # How many historical candles to fetch for indicator warm-up.
  history_candles: 500

risk:
  # Fraction of equity risked per trade (0.01 = 1%). Keep small.
  risk_per_trade: 0.01

  # Max fraction of equity any single position can consume.
  max_position_pct: 0.25

  # Max simultaneous open positions.
  max_open_positions: 3

  # Hard stop-loss as a fraction of entry price.
  stop_loss_pct: 0.03

  # Take-profit as a fraction of entry price (set 0 to disable).
  take_profit_pct: 0.06

  # Trailing stop distance as a fraction of the peak price since entry (0 disables).
  trailing_stop_pct: 0.02

  # Kill switch: stop trading for the day after this drawdown from start-of-day equity.
  daily_loss_limit_pct: 0.05

  # Global kill switch: stop entirely if total drawdown from peak equity exceeds this.
  max_drawdown_pct: 0.20

  # Fees and slippage used by paper / backtest.
  taker_fee_pct: 0.0026
  slippage_pct: 0.0005

  # After a losing trade, wait this many bars before re-entering the same
  # symbol. Prevents whipsaw bleeding.
  cooldown_bars_after_loss: 12

  # Skip setups whose take-profit / stop-loss ratio is below this value.
  # Ensures winners pay for losers even at a modest win rate.
  min_reward_to_risk: 1.5

  # Once unrealised profit reaches this % of entry, move stop to breakeven.
  # Locks in "can't lose" on winners. 0 disables.
  breakeven_trigger_pct: 0.02

  # Close a flat position that hasn't cleared its entry price after this many
  # bars. Kills dead trades that tie up capital. 0 disables.
  time_stop_bars: 48

  # When total drawdown exceeds this fraction, scale risk_per_trade by the
  # reduction factor. Prevents doubling down during bad streaks.
  drawdown_risk_reduction_threshold: 0.05
  drawdown_risk_reduction_factor: 0.5

strategy:
  # Which strategy to run. See bot/strategies/ for options or build your own.
  # Options: ma_crossover | rsi_reversion | macd | bollinger | ensemble
  name: ensemble

  # Ensemble combines sub-strategies. Two gates must pass to fire:
  #   - at least `min_agreement` members vote the same direction
  #   - the weighted score must reach `min_score`
  # Weights let you trust some strategies more than others.
  ensemble:
    min_agreement: 2
    min_score: 2.0
    members:
      - ma_crossover
      - rsi_reversion
      - macd
      - bollinger
    weights:
      ma_crossover: 1.2
      macd: 1.2
      rsi_reversion: 1.0
      bollinger: 0.8

  # Regime filter – drops entry signals taken in bad conditions. Only applies
  # to entries (longs). Exit signals always pass through.
  filter:
    enabled: true
    trend_ema: 200            # only long when price > 200-period EMA
    require_uptrend: true
    min_adx: 20               # only trade when ADX shows a real trend
    adx_period: 14
    min_atr_pct: 0.001        # require non-trivial volatility
    atr_period: 14
    # Higher-timeframe confirmation. Resamples the bar feed into htf_rule
    # (pandas offset alias, e.g. '4h', '1D') and requires an uptrend there.
    # Set htf_rule: null to disable.
    htf_rule: 4h
    htf_ema: 50
    # Supertrend direction gate (only enter when supertrend direction is +1).
    use_supertrend: true
    supertrend_period: 10
    supertrend_multiplier: 3.0
    # Require entry bar volume >= volume_mult * rolling mean. 0 disables.
    volume_mult: 1.2
    volume_period: 20

  params:
    ma_crossover:
      fast: 20
      slow: 50
    rsi_reversion:
      period: 14
      oversold: 30
      overbought: 70
    macd:
      fast: 12
      slow: 26
      signal: 9
    bollinger:
      period: 20
      std: 2.0

logging:
  level: INFO
  # Persist structured trade history to these files.
  trade_log: logs/trades.csv
  equity_log: logs/equity.csv

notifications:
  telegram: false
