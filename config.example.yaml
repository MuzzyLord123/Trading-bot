# ============================================================================
# Advanced Trading Bot - Configuration (AGGRESSIVE preset)
# Copy to config.yaml and tune to taste. config.yaml is gitignored.
#
# THIS CONFIG IS TUNED FOR MAX ACTIVITY AND HIGH RISK/REWARD.
# Expected behaviour: many more trades, higher average win, much larger
# drawdowns. Realistic outcomes range from +5-15%/month in good regimes to
# -30-50% drawdown in bad ones. You WILL have losing weeks.
# If you want to reduce risk, the key levers are:
#   risk.risk_per_trade (currently 0.05 = 5% of equity per trade)
#   risk.max_position_pct (currently 0.50 = half your capital per position)
#   risk.max_open_positions (currently 5)
# ============================================================================

exchange:
  # Any exchange supported by ccxt works (binance, kraken, coinbase, bybit, kucoin...).
  # Kraken is a good UK-friendly choice with GBP pairs.
  name: kraken
  # Some exchanges (coinbase, okx, kucoin) require a passphrase.
  requires_password: false
  # Sandbox / testnet if the exchange exposes one (binance does; kraken does not).
  sandbox: false
  # Rate limiter – let ccxt space out requests automatically.
  enable_rate_limit: true

trading:
  # 'paper' simulates fills against real prices, 'live' sends real orders.
  # Always start on paper. Switch to live only once you trust the behaviour.
  mode: paper

  # The quote currency your capital is denominated in.
  quote_currency: GBP

  # Starting capital used by paper trading and backtests (real capital in live).
  starting_capital: 500.0

  # Markets the bot will scan. Must exist on the chosen exchange.
  # More symbols = more shots on goal. Verify each pair exists on your exchange –
  # on Kraken you can list GBP pairs with:
  #   python -c "import ccxt; k=ccxt.kraken(); k.load_markets(); print([s for s in k.symbols if s.endswith('/GBP')])"
  symbols:
    - BTC/GBP
    - ETH/GBP
    - SOL/GBP
    - ADA/GBP
    - DOT/GBP
    - XRP/GBP
    - LINK/GBP
    - LTC/GBP

  # Candle timeframe the bot operates on. 1h balances noise vs frequency.
  # 15m gives more trades but more whipsaw; 4h is smoother but slower.
  timeframe: 1h

  # Seconds between each live cycle (ignored in backtest).
  poll_interval_seconds: 60

  # How many historical candles to fetch for indicator warm-up.
  history_candles: 500

risk:
  # Fraction of equity risked per trade. 0.05 = 5% — aggressive.
  # With a 2.5% stop loss this means positions are 200% of equity
  # notionally (capped by max_position_pct). 5 losers in a row = -25%.
  risk_per_trade: 0.05

  # Max fraction of equity any single position can consume.
  # 0.5 = half your capital can be in one trade.
  max_position_pct: 0.5

  # Max simultaneous open positions. More = more diversification but
  # also more correlated exposure in a crypto-wide selloff.
  max_open_positions: 5

  # Hard stop-loss as a fraction of entry price.
  # Tighter stop = larger position size for same risk, but more stop-outs.
  stop_loss_pct: 0.025

  # Take-profit as a fraction of entry price (set 0 to disable).
  # 9% TP vs 2.5% stop = 3.6:1 reward:risk — only need ~22% win rate to break even.
  take_profit_pct: 0.09

  # Trailing stop distance as a fraction of the peak price since entry (0 disables).
  # Wider trail lets winners run further.
  trailing_stop_pct: 0.03

  # Kill switch: stop trading for the day after this drawdown from start-of-day equity.
  # Wider than default so one bad day doesn't shut down a recovery.
  # Set to 1.0 to effectively disable (NOT recommended).
  daily_loss_limit_pct: 0.10

  # Global kill switch: stop entirely if total drawdown from peak equity exceeds this.
  # DO NOT REMOVE THIS. A single flash crash or exchange bug can blow up the
  # account in one tick without it. 0.40 = bot stops if equity falls below 60%
  # of peak. Restart manually after reviewing.
  max_drawdown_pct: 0.40

  # Fees and slippage used by paper / backtest.
  taker_fee_pct: 0.0026
  slippage_pct: 0.0005

  # After a losing trade, wait this many bars before re-entering the same
  # symbol. Short cooldown = faster re-entry; 0 = none.
  cooldown_bars_after_loss: 4

  # Skip setups whose take-profit / stop-loss ratio is below this value.
  # With TP=9% and stop=2.5% the ratio is already ~3.6, so this barely bites.
  min_reward_to_risk: 1.5

  # Once unrealised profit reaches this % of entry, move stop to breakeven.
  # Locks in "can't lose" on winners. 0 disables.
  breakeven_trigger_pct: 0.015

  # Close a flat position that hasn't cleared its entry price after this many
  # bars. Kills dead trades that tie up capital. 0 disables.
  time_stop_bars: 24

  # When total drawdown exceeds this fraction, scale risk_per_trade by the
  # reduction factor. Prevents doubling down during bad streaks.
  # Kept enabled — disable only if you want to press harder into drawdowns
  # (extremely risky).
  drawdown_risk_reduction_threshold: 0.10
  drawdown_risk_reduction_factor: 0.5

strategy:
  # Which strategy to run. See bot/strategies/ for options or build your own.
  # Options: ma_crossover | rsi_reversion | macd | bollinger | ensemble
  name: ensemble

  # Ensemble combines sub-strategies. Two gates must pass to fire:
  #   - at least `min_agreement` members vote the same direction
  #   - the weighted score must reach `min_score`
  # Weights let you trust some strategies more than others.
  # AGGRESSIVE: any single member firing can trigger an entry.
  ensemble:
    min_agreement: 1
    min_score: 0.8
    members:
      - ma_crossover
      - rsi_reversion
      - macd
      - bollinger
    weights:
      ma_crossover: 1.2
      macd: 1.2
      rsi_reversion: 1.0
      bollinger: 0.8

  # Regime filter – drops entry signals taken in bad conditions. Only applies
  # to entries (longs). Exit signals always pass through.
  # AGGRESSIVE: minimal filtering — trade in almost any regime.
  filter:
    enabled: true
    trend_ema: 50             # only long when price > 50-period EMA
    require_uptrend: true
    min_adx: 10               # allow even weakly-trending markets
    adx_period: 14
    min_atr_pct: 0.0003       # require any meaningful volatility
    atr_period: 14
    # Higher-timeframe confirmation disabled for max activity.
    htf_rule: null
    htf_ema: 50
    # Supertrend direction gate disabled for max activity.
    use_supertrend: false
    supertrend_period: 10
    supertrend_multiplier: 3.0
    # Volume filter disabled for max activity.
    volume_mult: 0
    volume_period: 20

  params:
    ma_crossover:
      fast: 20
      slow: 50
    rsi_reversion:
      period: 14
      oversold: 30
      overbought: 70
    macd:
      fast: 12
      slow: 26
      signal: 9
    bollinger:
      period: 20
      std: 2.0

logging:
  level: INFO
  # Persist structured trade history to these files.
  trade_log: logs/trades.csv
  equity_log: logs/equity.csv

notifications:
  telegram: false
