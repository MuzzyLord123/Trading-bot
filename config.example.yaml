# ============================================================================
# Trading 212 Invest (UK stocks & ETFs) - example config
#
# Copy to config.yaml and tune. Assumes:
#   * You have Trading 212 API access (request from Settings -> API in app)
#   * TRADING212_API_KEY is set in .env
#   * You intend to trade stocks/ETFs, not CFDs
#
# Data: Yahoo Finance (free, no auth). Execution: Trading 212 REST.
# Backtest uses yfinance too — no historical data from T212.
# ============================================================================

exchange:
  name: trading212
  # sandbox: true -> uses demo.trading212.com (set a demo API key in .env).
  sandbox: false

trading:
  # Always start on paper. Switch to 'live' only after a month of clean paper runs.
  mode: paper

  quote_currency: GBP

  # Your account size. Used for paper/backtest sizing; live uses real balance.
  starting_capital: 33000.0

  # Yahoo Finance tickers. Use ".L" suffix for LSE listings, plain for US.
  # Special tokens auto-expand (deduplicated where they overlap):
  #   SP500     -> ~500 S&P 500 constituents
  #   NASDAQ100 -> ~100 largest Nasdaq non-financials (tech-heavy)
  # The union of SP500 + NASDAQ100 = ~530 unique US large caps.
  symbols:
    - VWRL.L        # Vanguard FTSE All-World (global equity)
    - VUAG.L        # Vanguard S&P 500 (accumulating)
    - SP500
    - NASDAQ100

  # Hourly stock bars. ~6-7 bars per trading day per stock = 6-7x more
  # signal opportunities than daily. WARNING: intraday data is noisier;
  # win rate typically drops 5-15% vs daily. This config is optimised
  # for TRADE COUNT, not win rate.
  timeframe: 1h

  # Between ticks in live mode. Hourly bars close every hour, so polling
  # every 5 min is plenty.
  poll_interval_seconds: 300

  history_candles: 1000   # ~30 weeks of hourly bars (yfinance caps 60m at 730d)

risk:
  # 1% per trade is the default for accounts of this size. 1% of £33k = £330
  # per losing trade. 10 losers in a row = -10% equity (£3,300). Historically
  # survivable with this strategy.
  risk_per_trade: 0.01

  # Max single position as a fraction of equity. 7% = ~£2,300 per stock.
  # Lower than before to fit more concurrent positions without over-deploying.
  max_position_pct: 0.07

  # Max simultaneous open positions across all symbols.
  # 15 on hourly bars = faster turnover = more trades/year.
  max_open_positions: 15

  # Stops sized for hourly-bar stock volatility.
  stop_loss_pct: 0.04
  take_profit_pct: 0.10     # 2.5:1 R:R

  trailing_stop_pct: 0.03

  # Halt trading after -3% from start-of-day equity.
  daily_loss_limit_pct: 0.03

  # Hard kill switch: stop entirely if total drawdown from peak > 15%.
  # On £33k that's a £4,950 drawdown. Restart manually after reviewing.
  max_drawdown_pct: 0.15

  # Trading 212 Invest is £0 commission on stocks/ETFs. Spread is the cost.
  # Rough spread for liquid names ~0.05-0.10%; FX spread on US stocks ~0.15%
  # one-way. Combine conservatively.
  taker_fee_pct: 0.0015
  slippage_pct: 0.0005

  # Bars to wait before re-entering a symbol after a losing exit.
  # On hourly bars, 2 = 2 hours. Fast re-entry for more trade volume.
  cooldown_bars_after_loss: 2

  min_reward_to_risk: 1.5
  breakeven_trigger_pct: 0.02
  # Close a flat position after 24 hours of trading (~4 days).
  time_stop_bars: 24

  drawdown_risk_reduction_threshold: 0.05
  drawdown_risk_reduction_factor: 0.5

strategy:
  # Ensemble proved best on real data; keep it.
  name: ensemble

  ensemble:
    min_agreement: 1
    # Was 0.8. Lowered further to 0.5 — any member with weight >= 0.5
    # triggers an entry on its own. All members now qualify.
    min_score: 0.5
    members:
      - ma_crossover
      - rsi_reversion
      - macd
      - bollinger
    weights:
      ma_crossover: 1.2
      macd: 1.2
      rsi_reversion: 1.0
      bollinger: 0.8

  # Regime filters DRAMATICALLY LOOSENED to hit high trade count.
  # Target: 300-600 trades/year. Win rate will likely drop vs the
  # daily-bar config that achieved 61% on 13 trades.
  filter:
    enabled: true
    # Uptrend requirement DISABLED — on hourly bars, 30-period EMA is
    # just 30 hours (~5 days), and most S&P 500 names are above it most
    # of the time anyway. Filter was adding little.
    trend_ema: 30
    require_uptrend: false
    min_adx: 0               # ADX disabled on hourly — too noisy to use
    adx_period: 14
    min_atr_pct: 0.001       # loose – only excludes truly dead stocks
    atr_period: 14
    htf_rule: null
    htf_ema: 20
    use_supertrend: false
    supertrend_period: 10
    supertrend_multiplier: 3.0
    volume_mult: 0
    volume_period: 20

    # Defensive news gates – cheap to keep on, they filter very few trades
    # but dodge the biggest event-driven disasters.
    earnings_blackout_days: 2
    news_gap_threshold: 0.05

  # Indicator periods tuned for hourly stock bars.
  params:
    ma_crossover:
      fast: 8
      slow: 21
    rsi_reversion:
      period: 10
      oversold: 30
      overbought: 70
    macd:
      fast: 8
      slow: 21
      signal: 5
    bollinger:
      period: 15
      std: 2.0

logging:
  level: INFO
  trade_log: logs/trades.csv
  equity_log: logs/equity.csv

notifications:
  telegram: false
