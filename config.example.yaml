# ============================================================================
# Advanced Trading Bot - Configuration
# Copy to config.yaml and tune to taste. config.yaml is gitignored.
#
# Settings below are the most profitable combo found on REAL Kraken hourly
# data (not synthetic). On the 365-day backtest this was:
#   strategy: ensemble (all 4 members, min_agreement=2, min_score=1.5)
#   filter: trend_ema=100, min_adx=15, no HTF/supertrend/volume gates
#   risk_per_trade: 3% (was 1% in original test — scaled up for better returns)
# Previous runs with looser filters or MACD-solo underperformed this on
# real data. Further tuning without real walk-forward testing risks
# overfitting.
# ============================================================================

exchange:
  name: kraken
  requires_password: false
  sandbox: false
  enable_rate_limit: true

trading:
  # 'paper' simulates fills against real prices, 'live' sends real orders.
  # Always start on paper. Switch to live only once you trust the behaviour.
  mode: paper

  quote_currency: GBP
  starting_capital: 500.0

  # More symbols = more shots on goal. List Kraken GBP pairs with:
  #   python -c "import ccxt; k=ccxt.kraken(); k.load_markets(); print([s for s in k.symbols if s.endswith('/GBP')])"
  symbols:
    - BTC/GBP
    - ETH/GBP
    - SOL/GBP
    - ADA/GBP
    - DOT/GBP
    - XRP/GBP
    - LINK/GBP
    - LTC/GBP

  timeframe: 1h
  poll_interval_seconds: 60
  history_candles: 500

risk:
  # 3% per trade. At 1% previously = £4/year; at 3% expect ~£10-25/year.
  # Higher risk isn't worth it — past 3% the fat-tail risk of a single
  # bad trade or flash crash dominates expected return.
  risk_per_trade: 0.03

  # Max fraction of equity any single position can consume.
  max_position_pct: 0.5

  # Max simultaneous open positions.
  max_open_positions: 4

  # Hard stop-loss as a fraction of entry price.
  stop_loss_pct: 0.03

  # Take-profit as a fraction of entry price. 2:1 reward:risk.
  take_profit_pct: 0.06

  # Trailing stop distance as a fraction of peak price since entry.
  trailing_stop_pct: 0.02

  # Stop trading for the day after this drawdown from start-of-day equity.
  daily_loss_limit_pct: 0.08

  # Global kill switch. DO NOT REMOVE — protects against flash crashes.
  max_drawdown_pct: 0.30

  taker_fee_pct: 0.0026
  slippage_pct: 0.0005

  cooldown_bars_after_loss: 8
  min_reward_to_risk: 1.5
  breakeven_trigger_pct: 0.015
  time_stop_bars: 36

  drawdown_risk_reduction_threshold: 0.08
  drawdown_risk_reduction_factor: 0.5

strategy:
  # Ensemble beat MACD-solo on real Kraken data (60% vs 36% WR).
  name: ensemble

  ensemble:
    min_agreement: 2
    min_score: 1.5
    members:
      - ma_crossover
      - rsi_reversion
      - macd
      - bollinger
    weights:
      ma_crossover: 1.2
      macd: 1.2
      rsi_reversion: 1.0
      bollinger: 0.8

  # Filter config that produced 60% win rate on real Kraken.
  filter:
    enabled: true
    trend_ema: 100
    require_uptrend: true
    min_adx: 15
    adx_period: 14
    min_atr_pct: 0.0005
    atr_period: 14
    # Extra gates left disabled — they helped on synthetic, hurt on real.
    htf_rule: null
    htf_ema: 50
    use_supertrend: false
    supertrend_period: 10
    supertrend_multiplier: 3.0
    volume_mult: 0
    volume_period: 20

  params:
    ma_crossover:
      fast: 20
      slow: 50
    rsi_reversion:
      period: 14
      oversold: 30
      overbought: 70
    macd:
      fast: 12
      slow: 26
      signal: 9
    bollinger:
      period: 20
      std: 2.0

logging:
  level: INFO
  trade_log: logs/trades.csv
  equity_log: logs/equity.csv

notifications:
  telegram: false
