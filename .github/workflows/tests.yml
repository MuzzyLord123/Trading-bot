name: tests

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Smoke-test entry points
        run: |
          python -c "import ast; ast.parse(open('run.py').read())"
          python -c "import ast; ast.parse(open('backtest.py').read())"
          python -c "import ast; ast.parse(open('dashboard.py').read())"
          python -c "import ast; ast.parse(open('launch_dashboard.py').read())"
